<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PSOrvia Klangvergleich – minimal demo</title>
<link rel="stylesheet" href="klangvergleich.css"></head>
<body style="max-width:50rem;margin:2rem auto;padding:0 16px;font:16px/1.5 system-ui,sans-serif">
<h1>PSOrvia Klangvergleich</h1>
<div id="kv"><audio controls src="media/glocke-vorher.m4a"></audio> <audio controls src="media/glocke-nachher.m4a"></audio></div>
<script type="module">
import { create } from './klangvergleich.esm.js';
const data = await (await fetch('media/glocke.json')).json();
create(document.getElementById('kv'), { before: { src: 'media/glocke-vorher.m4a', label: 'Ratio' }, after: { src: 'media/glocke-nachher.m4a', label: 'Envelopes' }, data });
</script></body></html>
